name: Witchcraft
version: ${version}
main: com.witchcraft.Witchcraft
api-version: '1.21'
description: An immersive magical progression system for Minecraft
author: WitchcraftTeam
website: https://github.com/WitchcraftPlugin/Witchcraft

dependencies:
  server:
    Paper:
      load: BEFORE
      required: true

folia-supported: false

permissions:
  witchcraft.admin:
    description: Allows access to all Witchcraft admin commands
    default: op
    children:
      witchcraft.reload: true
      witchcraft.debug: true
  witchcraft.reload:
    description: Allows reloading the Witchcraft configuration
    default: op
  witchcraft.cast:
    description: Allows casting rituals and incantations
    default: true
  witchcraft.learn:
    description: Allows learning new incantations from books
    default: true
  witchcraft.curse:
    description: Allows casting curse spells
    default: true
  witchcraft.protection:
    description: Allows casting protection spells
    default: true
  witchcraft.scrying:
    description: Allows casting scrying spells
    default: true
  witchcraft.debug:
    description: Allows debug commands
    default: op
